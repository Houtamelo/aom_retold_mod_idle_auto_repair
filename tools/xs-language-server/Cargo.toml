[package]
name = "xs-language-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "5"
scraper = "0.21"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sevenz-rust = "0.6"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1.52.3", features = ["full"] }
tower-lsp = { version = "0.20.0", features = ["tokio", "tokio-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tree-sitter = "0.26.9"
tree-sitter-c = "0.24.2"
tree-sitter-language = "0.1"
tree-sitter-xs = { version = "0.1.0", path = "tree-sitter-xs" }

[dev-dependencies]
walkdir = "2"
