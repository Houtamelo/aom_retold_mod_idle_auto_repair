[package]
name = "xs-language-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
dirs = "6"
scraper = "0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sevenz-rust = "0.6"
sha2 = "0.10"
smallvec = "1"
tempfile = "3"
tokio = { version = "1.52.3", features = ["full"] }
tower-lsp-server = { version = "0.23.0", features = ["tokio", "tokio-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xs-parser = { path = "../xs-parser" }

# Lelwel deps
logos = "0.16"
codespan-reporting = "0.13"

[build-dependencies]
lelwel = "0.10"

[dev-dependencies]
walkdir = "2"

[[test]]
name = "ui_tests"
path = "tests/ui_tests.rs"
harness = false
