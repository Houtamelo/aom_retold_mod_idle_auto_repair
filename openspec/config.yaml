schema: spec-driven

context: |
  Tech stack: Age of Mythology: Retold XS AI scripts (C-like scripting language loaded by the game engine). Bash deploy script only.
  Architecture: Each mod overlays game/ai/human_assist/human_assist.xs with a feature include (auto_repair.xs / auto_scout.xs). The combined mod unifies both includes in its own human_assist.xs and reuses the feature source files at deploy time.
  Testing: No automated test runner exists for XS. Verification is manual: syntax check via game load, deploy to local mods folder, and in-game aiEcho log inspection.
  Style: Three-space indentation in XS, block headers with //======, semantic conventional commits.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Note patch-maintenance impact on human_assist.xs overlay
  specs:
    - Use Given/When/Then for player-facing scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Call out XS engine constraints and kb* API behavior
  design:
    - Include state-machine diagrams where relevant
    - Document architecture decisions with rationale
    - Note which files are shared across mods (auto_scout.xs, auto_repair.xs)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Mark manual verification steps explicitly
  apply:
    - Follow existing code patterns
    - Never edit the running AoM:R game folder
    - Update the combined mod's human_assist.xs when either feature's include/call site changes
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Preserve per-mod human_assist.xs overlay notes for patch maintenance

strict_tdd: false
testing:
  runner: none
  sandboxed_tdd: false
  strict_tdd: false
  verification_method: manual_deploy_and_ingame_log

# Per-domain override: tooling tasks (LSP server in Rust, IntelliJ plugin in
# Kotlin/Gradle) DO have a test runner (`cargo test` and `./gradlew test`).
# Strict TDD applies to any change touching:
#   - tools/xs-language-server/ (Rust LSP)
#   - tools/intellij-xs-plugin/ (Kotlin/Gradle plugin)
# Rationale: tooling changes ship behavioral guarantees; tests are the
# verification method. Modifications to XS scripts under mod/ still fall
# under the global strict_tdd: false above (no test runner available).
strict_tdd_overrides:
  - domain: tools/xs-language-server/**
    strict_tdd: true
    test_runner: "cargo test --manifest-path tools/xs-language-server/Cargo.toml"
    applies_to: [sdd-apply, sdd-verify]
  - domain: tools/intellij-xs-plugin/**
    strict_tdd: true
    test_runner: "./gradlew :test"
    applies_to: [sdd-apply, sdd-verify]
    note: "Plugin tests use JUnit5 via Kotlin/Gradle. Foreign-uid may own build dirs; `sudo chown -R $(id -un):$(id -gn) tools/intellij-xs-plugin/{build,dist}` to unblock Gradle."
